name: "Release"

on:
  push:
    branches: [main]
    paths:
      - '.sampo/changesets/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Concurrency control: only one release process can run at a time
# This prevents race conditions if multiple releasable changesets merge simultaneously
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: posthog/sdk-test-harness
  V2_IMAGE_NAME: posthog/sdk-test-harness-v2
  SDK_SPECS_COMMIT: 1d5fe4255c7990e8c2c09613c600fda590baf3cb

jobs:
  check-changesets:
    name: Check for changesets
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.check.outputs.has-changesets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check for changesets
        id: check
        run: |
          changeset_count=$(find .sampo/changesets -name '*.md' 2>/dev/null | wc -l)
          if [ "$changeset_count" -gt 0 ]; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found $changeset_count changeset(s), ready to release"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            echo "No changesets to release"
          fi

  notify-approval-needed:
    name: Notify Slack - Approval Needed
    needs: check-changesets
    if: needs.check-changesets.outputs.has-changesets == 'true'
    uses: PostHog/.github/.github/workflows/notify-approval-needed.yml@5ba5d24966f2c416ca792654638e4ce6f19f545b
    with:
      slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
      slack_user_group_id: ${{ vars.GROUP_CLIENT_LIBRARIES_SLACK_GROUP_ID }}
    secrets:
      slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
      posthog_project_api_key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}

  release:
    name: Release and publish
    needs: [check-changesets, notify-approval-needed]
    runs-on: ubuntu-latest
    # Use `always()` to ensure the job runs even if the Slack notification fails
    # but still depend on it to be able to use `needs.notify-approval-needed.outputs.slack_ts`
    if: always() && needs.check-changesets.outputs.has-changesets == 'true'
    environment: "Release"  # Requires human approval; approvers are pinged in Slack above.
    permissions:
      contents: read
      packages: write       # ghcr.io push
    outputs:
      new-version: ${{ steps.sampo-release.outputs.new_version }}
      v1-digest: ${{ steps.publish-v1.outputs.digest }}
      v2-digest: ${{ steps.publish-v2.outputs.digest }}
    steps:
      - name: Notify Slack - Approved
        if: needs.notify-approval-needed.outputs.slack_ts != ''
        uses: PostHog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "✅ Release approved! Version bump in progress..."
          emoji_reaction: "white_check_mark"

      - name: Get GitHub App token
        id: releaser
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_POSTHOG_SDK_TEST_HARNESS_RELEASER_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_SDK_TEST_HARNESS_RELEASER_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.releaser.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.91.1
          components: cargo

      - name: Cache Sampo CLI
        id: cache-sampo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/sampo
          key: sampo-0.17.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install Sampo CLI
        if: steps.cache-sampo.outputs.cache-hit != 'true'
        run: cargo install sampo@0.17.4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.26"
          python-version: "3.12.12"

      - name: Prepare release with Sampo
        id: sampo-release
        env:
          GITHUB_TOKEN: ${{ steps.releaser.outputs.token }}
        run: |
          sampo release
          new_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Sync version to __init__.py
        env:
          NEW_VERSION: ${{ steps.sampo-release.outputs.new_version }}
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"$NEW_VERSION\"/" src/posthog_test_harness/__init__.py

      # The project version is also recorded in uv.lock. Commit the updated
      # lock before the clean, --locked v2 distribution build.
      - name: Sync release lockfile
        run: uv lock

      - name: Commit release changes
        id: commit-release
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "chore: Release v${{ steps.sampo-release.outputs.new_version }} [skip ci]"
          repo: ${{ github.repository }}
          branch: main
        env:
          GITHUB_TOKEN: ${{ steps.releaser.outputs.token }}

      # ghcommit-action commits via the API without touching the local workspace,
      # so reset the checkout to the new commit before tagging / building Docker —
      # otherwise later steps operate on the pre-bump tree.
      - name: Sync checkout to release commit
        if: steps.commit-release.outputs.commit-hash != ''
        env:
          COMMIT_HASH: ${{ steps.commit-release.outputs.commit-hash }}
        run: |
          git fetch origin main
          git reset --hard "$COMMIT_HASH"

      # Keep both the specs checkout and distribution outputs outside the
      # harness tree: the packager requires clean committed source provenance.
      - name: Checkout pinned SDK specs
        if: steps.commit-release.outputs.commit-hash != ''
        run: |
          git init "$RUNNER_TEMP/sdk-specs"
          git -C "$RUNNER_TEMP/sdk-specs" remote add origin https://github.com/PostHog/sdk-specs.git
          git -C "$RUNNER_TEMP/sdk-specs" fetch --depth=1 origin "$SDK_SPECS_COMMIT"
          git -C "$RUNNER_TEMP/sdk-specs" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sdk-specs" rev-parse HEAD)" = "$SDK_SPECS_COMMIT"

      - name: Build v2 distribution
        if: steps.commit-release.outputs.commit-hash != ''
        run: |
          uv sync --locked --no-dev
          uv run --locked --no-dev python scripts/build_v2_distribution.py \
            --specs "$RUNNER_TEMP/sdk-specs" --out "$RUNNER_TEMP/v2-distribution"

      - name: Smoke installed v2 distribution
        if: steps.commit-release.outputs.commit-hash != ''
        run: |
          uv venv --python 3.12.12 "$RUNNER_TEMP/v2-smoke-venv"
          uv pip install --python "$RUNNER_TEMP/v2-smoke-venv/bin/python" \
            --require-hashes -r "$RUNNER_TEMP/v2-distribution/requirements.lock"
          uv pip install --python "$RUNNER_TEMP/v2-smoke-venv/bin/python" \
            --no-deps "$RUNNER_TEMP"/v2-distribution/*.whl
          uv run --locked --no-dev python scripts/smoke_v2_distribution.py \
            --python "$RUNNER_TEMP/v2-smoke-venv/bin/python" --out "$RUNNER_TEMP/v2-smoke"

      # Both image paths remain inside the approved Release environment.
      - name: Set up QEMU
        if: steps.commit-release.outputs.commit-hash != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.commit-release.outputs.commit-hash != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build v2 image for smoke
        if: steps.commit-release.outputs.commit-hash != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ runner.temp }}/v2-distribution
          file: ./Dockerfile.v2
          load: true
          push: false
          tags: sdk-test-harness-v2:release-smoke-amd64
          platforms: linux/amd64
          cache-from: type=gha,scope=v2
          cache-to: type=gha,scope=v2,mode=max

      - name: Build arm64 v2 image for smoke
        if: steps.commit-release.outputs.commit-hash != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ runner.temp }}/v2-distribution
          file: ./Dockerfile.v2
          load: true
          push: false
          tags: sdk-test-harness-v2:release-smoke-arm64
          platforms: linux/arm64
          cache-from: type=gha,scope=v2
          cache-to: type=gha,scope=v2,mode=max

      - name: Smoke v2 image
        if: steps.commit-release.outputs.commit-hash != ''
        run: |
          for arch in amd64 arm64; do
            reports="$RUNNER_TEMP/v2-image-smoke/$arch"
            mkdir -p "$reports"
            docker run --rm --platform "linux/$arch" "sdk-test-harness-v2:release-smoke-$arch" bundle-info \
              > "$reports/bundle-info.json"
            docker run --rm --platform "linux/$arch" -v "$reports:/reports" \
              "sdk-test-harness-v2:release-smoke-$arch" discover --migration-suite --require-ready \
              --report /reports/discovery.json
            docker run --rm --platform "linux/$arch" -v "$reports:/reports" \
              "sdk-test-harness-v2:release-smoke-$arch" discover --acceptance-suite --require-ready \
              --report /reports/acceptance-discovery.json
          done

      # Publish release metadata only after distribution and both image smokes pass.
      # Tags are bare X.Y.Z, matching the other Sampo SDKs.
      - name: Tag release
        if: steps.commit-release.outputs.commit-hash != ''
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          NEW_VERSION: ${{ steps.sampo-release.outputs.new_version }}
          COMMIT_HASH: ${{ steps.commit-release.outputs.commit-hash }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/tags/${NEW_VERSION}" \
            -f "sha=${COMMIT_HASH}"

      - name: Create GitHub Release
        if: steps.commit-release.outputs.commit-hash != ''
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          NEW_VERSION: ${{ steps.sampo-release.outputs.new_version }}
        run: |
          CHANGELOG_ENTRY=$(awk -v defText="see CHANGELOG.md" '/^## /{if (flag) exit; flag=1; next} flag; END{if (!flag) print defText}' CHANGELOG.md | sed '/[^[:space:]]/,$!d' | tac | sed '/[^[:space:]]/,$!d' | tac)
          # Mark 0.x.y versions as pre-releases (we are not yet committing to a
          # stable API). Mirrors the previous workflow's pre-release behavior
          # for versions starting with 0., and drops automatically once we tag
          # 1.0.0+.
          PRERELEASE_FLAG=""
          case "$NEW_VERSION" in
            0.*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$NEW_VERSION" --notes "$CHANGELOG_ENTRY" $PRERELEASE_FLAG

      - name: Log in to Container Registry
        if: steps.commit-release.outputs.commit-hash != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        if: steps.commit-release.outputs.commit-hash != ''
        id: docker-tags
        env:
          NEW_VERSION: ${{ steps.sampo-release.outputs.new_version }}
        run: |
          MAJOR=$(echo "$NEW_VERSION" | cut -d. -f1)
          MINOR=$(echo "$NEW_VERSION" | cut -d. -f2)
          {
            echo "exact=$NEW_VERSION"
            echo "major_minor=${MAJOR}.${MINOR}"
            echo "major=$MAJOR"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        if: steps.commit-release.outputs.commit-hash != ''
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # docker/metadata-action's `type=semver` only fires on `refs/tags/v*`
          # pushes; our trigger is push-to-main with a sampo-derived version, so
          # we feed in the precomputed values as `type=raw`. Tag set matches the
          # previous publish.yml: exact version, major.minor, and latest. A
          # major-only tag (e.g. `1`) is added once we're past v0.x — mirrors
          # publish.yml's previous `!startsWith(ref, 'refs/tags/v0.')` gate.
          #
          # `latest` is kept deliberately: most SDK compliance workflows pin
          # `test-harness-version: "latest"`, and the README quick-start runs
          # `sdk-test-harness:latest`. The security fix was gating *when* latest
          # moves (now only inside this approved Release job), not removing it.
          # Longer term, all harness consumers should move to digest-pinned
          # images (like posthog-python's `main-<sha>@sha256:...`) so a moving
          # `latest` can't silently change what their CI runs; once they have,
          # we can revisit dropping `latest` here.
          tags: |
            type=raw,value=${{ steps.docker-tags.outputs.exact }}
            type=raw,value=${{ steps.docker-tags.outputs.major_minor }}
            type=raw,value=${{ steps.docker-tags.outputs.major }},enable=${{ steps.docker-tags.outputs.major != '0' }}
            type=raw,value=latest

      - name: Extract v2 metadata
        if: steps.commit-release.outputs.commit-hash != ''
        id: meta-v2
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.V2_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.docker-tags.outputs.exact }}
            type=raw,value=${{ steps.docker-tags.outputs.major_minor }}
            type=raw,value=${{ steps.docker-tags.outputs.major }},enable=${{ steps.docker-tags.outputs.major != '0' }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: publish-v1
        if: steps.commit-release.outputs.commit-hash != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push v2 Docker image
        if: steps.commit-release.outputs.commit-hash != ''
        id: publish-v2
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ runner.temp }}/v2-distribution
          file: ./Dockerfile.v2
          push: true
          tags: ${{ steps.meta-v2.outputs.tags }}
          labels: ${{ steps.meta-v2.outputs.labels }}
          cache-from: type=gha,scope=v2
          cache-to: type=gha,scope=v2,mode=max
          platforms: linux/amd64,linux/arm64

      # Preserve successful outputs even when a later push fails. The registry
      # updates are not atomic; a failed push may also have moved some tags.
      - name: Record image handoff
        if: always() && steps.commit-release.outputs.commit-hash != ''
        env:
          RELEASE_VERSION: ${{ steps.sampo-release.outputs.new_version }}
          RELEASE_COMMIT: ${{ steps.commit-release.outputs.commit-hash }}
          V1_DIGEST: ${{ steps.publish-v1.outputs.digest }}
          V2_DIGEST: ${{ steps.publish-v2.outputs.digest }}
          V1_OUTCOME: ${{ steps.publish-v1.outcome }}
          V2_OUTCOME: ${{ steps.publish-v2.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          images = {}
          for key, name in [("v1", "IMAGE_NAME"), ("v2", "V2_IMAGE_NAME")]:
              image = os.environ["REGISTRY"] + "/" + os.environ[name]
              digest = os.environ[key.upper() + "_DIGEST"]
              images[key] = {
                  "image": image,
                  "digest": digest or None,
                  "reference": image + "@" + digest if digest else None,
                  "outcome": os.environ[key.upper() + "_OUTCOME"],
              }
          record = {
              "version": os.environ["RELEASE_VERSION"],
              "release_commit": os.environ["RELEASE_COMMIT"],
              "specs_commit": os.environ["SDK_SPECS_COMMIT"],
              "images": images,
          }
          Path(os.environ["RUNNER_TEMP"], "release-images.json").write_text(json.dumps(record, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Image handoff\n\n```json\n" + json.dumps(record, indent=2) + "\n```\n")
          PY

      - name: Upload release handoff artifacts
        if: always() && steps.commit-release.outputs.commit-hash != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-release-${{ steps.sampo-release.outputs.new_version }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-images.json
            ${{ runner.temp }}/v2-distribution/
            ${{ runner.temp }}/v2-smoke/
            ${{ runner.temp }}/v2-image-smoke/
          if-no-files-found: error

      - name: Send failure event to PostHog
        if: ${{ failure() }}
        continue-on-error: true
        uses: PostHog/posthog-github-action@9a6a19d360820ab4d95ecc4a5a7564062c895f84 # v1.3.0
        with:
          posthog-token: "${{ secrets.POSTHOG_PROJECT_API_KEY }}"
          event: "posthog-sdk-github-release-workflow-failure"
          properties: >-
            {
              "commitSha": "${{ github.sha }}",
              "jobStatus": "${{ job.status }}",
              "ref": "${{ github.ref }}",
              "repository": "${{ github.repository }}",
              "sdk": "posthog-sdk-test-harness",
              "jobName": "release",
              "packageName": "posthog-sdk-test-harness",
              "packageVersion": "${{ steps.sampo-release.outputs.new_version || 'unknown' }}",
              "actionUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "alertText": ":rotating_light: Failed to release posthog-sdk-test-harness@${{ steps.sampo-release.outputs.new_version }} :rotating_light:",
              "alertContext": "The release workflow failed before completion."
            }

      - name: Notify Slack - Failed
        if: ${{ failure() && needs.notify-approval-needed.outputs.slack_ts != '' }}
        uses: PostHog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "❌ Failed to release `posthog-sdk-test-harness@${{ steps.sampo-release.outputs.new_version }}`! <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
          emoji_reaction: "x"

  notify-rejected:
    name: Notify Slack - Rejected
    needs: [check-changesets, notify-approval-needed, release]
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'failure' && needs.notify-approval-needed.outputs.slack_ts != ''
    steps:
      - name: Check for rejection
        id: check-rejection
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          RESPONSE=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals")
          REJECTED=$(echo "$RESPONSE" | jq '[.[] | select(.state == "rejected")] | length')
          if [ "$REJECTED" -gt 0 ]; then
            echo "was_rejected=true" >> "$GITHUB_OUTPUT"
            COMMENT=$(echo "$RESPONSE" | jq -r '.[] | select(.state == "rejected") | .comment // empty' | head -1)
            if [ -n "$COMMENT" ]; then
              {
                echo 'message<<EOF'
                echo "🚫 Release was rejected: $COMMENT"
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
            else
              echo "message=🚫 Release was rejected." >> "$GITHUB_OUTPUT"
            fi
          else
            echo "was_rejected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack - Rejected
        if: steps.check-rejection.outputs.was_rejected == 'true'
        continue-on-error: true
        uses: PostHog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: '${{ steps.check-rejection.outputs.message }}'
          emoji_reaction: 'no_entry_sign'

  notify-released:
    name: Notify Slack - Released
    needs: [check-changesets, notify-approval-needed, release]
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'success' && needs.notify-approval-needed.outputs.slack_ts != ''
    steps:
      - name: Notify Slack - Released
        uses: PostHog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "🚀 posthog-sdk-test-harness v${{ needs.release.outputs.new-version }} released successfully!"
          emoji_reaction: "rocket"
