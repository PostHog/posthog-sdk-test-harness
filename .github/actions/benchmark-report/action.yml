name: SDK benchmark report
description: Validate and render paired SDK results, or publish from a verified workflow_run
inputs:
  mode:
    description: render (offline) or publish (trusted workflow_run only)
    default: render
  source-status:
    description: Measurement step outcome for render mode; publish mode uses the verified source run conclusion
    default: ''
  base-results:
    description: Baseline result JSON path for render mode
    default: ''
  head-results:
    description: Head result JSON path for render mode
    default: ''
  output-directory:
    description: Directory for report.md and comparison.json
    default: benchmark-report
  workflow-path:
    description: Trusted literal producer workflow path for publish mode
    default: ''
  artifact-name:
    description: Trusted literal producer artifact name for publish mode
    default: ''
  report-key:
    description: Trusted stable comment namespace for publish mode
    default: ''
  sdk:
    description: Trusted literal SDK identity for publish mode
    default: ''
outputs:
  report-path:
    description: Absolute Markdown report path
    value: ${{ steps.report.outputs.report-path }}
  comparison-path:
    description: Absolute comparison JSON path
    value: ${{ steps.report.outputs.comparison-path }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: '0.13.4'
        python-version: '3.12.12'
        enable-cache: 'false'
    - id: report
      shell: bash
      env:
        REPORT_ACTION_ROOT: ${{ github.action_path }}
        REPORT_MODE: ${{ inputs.mode }}
        REPORT_SOURCE_STATUS: ${{ inputs.source-status }}
        REPORT_BASE: ${{ inputs.base-results }}
        REPORT_HEAD: ${{ inputs.head-results }}
        REPORT_OUTPUT: ${{ inputs.output-directory }}
        REPORT_WORKFLOW: ${{ inputs.workflow-path }}
        REPORT_ARTIFACT: ${{ inputs.artifact-name }}
        REPORT_KEY: ${{ inputs.report-key }}
        REPORT_SDK: ${{ inputs.sdk }}
      run: |
        set -euo pipefail
        root="$(cd "$REPORT_ACTION_ROOT/../../.." && pwd)"
        uv sync --no-config --project "$root" --frozen --no-dev --no-install-project
        uv run --no-config --project "$root" --no-sync \
          python -I "$root/benchmarks/report/cli.py" \
          --mode "$REPORT_MODE" --source-status "$REPORT_SOURCE_STATUS" \
          --base-results "$REPORT_BASE" --head-results "$REPORT_HEAD" \
          --output-directory "$REPORT_OUTPUT" --workflow-path "$REPORT_WORKFLOW" \
          --artifact-name "$REPORT_ARTIFACT" --report-key "$REPORT_KEY" --sdk "$REPORT_SDK"
