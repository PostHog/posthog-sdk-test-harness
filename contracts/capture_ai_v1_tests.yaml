    description: Tests for the Capture V1 AI endpoint (capture_ai, POST /i/v1/ai/events)
    requires: capture_ai_v1
    categories:
      routing:
        description: capture_ai rides the V1 AI endpoint; capture never reroutes
        tests:
          - name: capture_ai_posts_to_v1_ai_endpoint
            description: capture_ai events reach /i/v1/ai/events and no analytics endpoint
            sdk_types: [server]
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
              - action: flush
              - action: assert_request_count
                params:
                  expected: 1
              - action: assert_request_path
                params:
                  expected: /i/v1/ai/events
              - action: assert_event_field
                params:
                  field: event
                  expected: $ai_generation

          - name: capture_does_not_reroute_ai_named_events
            description: capture() keeps $ai_* names on a normal capture endpoint
            sdk_types: [server]
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture
                params:
                  distinct_id: test_user
                  event: $ai_generation
              - action: flush
              - action: assert_request_count
                params:
                  expected: 1
              - action: assert_request_path
                params:
                  # An adapter may advertise both capture versions.
                  expected: [/batch, /i/v1/analytics/events]
              - action: assert_no_requests_to_paths
                params:
                  paths:
                    - /i/v1/ai/events

      wire_format:
        description: capture_ai requests use the V1 headers and body
        tests:
          - name: has_authorization_bearer_header
            description: Authorization header uses Bearer scheme with the configured API key
            sdk_types: [server]
            steps:
              - action: init
                params:
                  api_key: phc_test_key
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
              - action: flush
              - action: assert_authorization_bearer_token
                params:
                  expected: phc_test_key

          - name: has_v1_request_headers
            description: PostHog-Sdk-Info, PostHog-Attempt, PostHog-Request-Id and PostHog-Request-Timestamp are well-formed
            sdk_types: [server]
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
              - action: flush
              - action: assert_header_value_matches
                params:
                  header: PostHog-Sdk-Info
                  pattern: "^.+/.+$"
              - action: assert_header_is_integer
                params:
                  header: PostHog-Attempt
                  expected: 1
              - action: assert_header_is_uuid
                params:
                  header: PostHog-Request-Id
              - action: assert_header_is_rfc3339
                params:
                  header: PostHog-Request-Timestamp

          - name: body_has_created_at_and_batch
            description: Body is a V1 batch with created_at
            sdk_types: [server]
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
              - action: flush
              - action: assert_v1_body_format

      identity:
        description: UUID generation and return value
        tests:
          - name: capture_ai_event_has_uuid
            description: AI events always carry a client-generated UUID
            sdk_types: [server]
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
              - action: assert_action_result
                params:
                  field: success
                  expected: true
              - action: flush
              - action: assert_event_has_field
                params:
                  field: uuid
              - action: assert_uuid_format
                params:
                  field: uuid
              - action: assert_action_result_uuid_matches_event

          - name: capture_ai_keeps_supplied_uuid
            description: A caller-supplied UUID is preserved on the wire
            sdk_types: [server]
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
                  uuid: 0198c0de-0000-7000-8000-000000000abc
              - action: assert_action_result
                params:
                  field: uuid
                  expected: 0198c0de-0000-7000-8000-000000000abc
              - action: flush
              - action: assert_event_field
                params:
                  field: uuid
                  expected: 0198c0de-0000-7000-8000-000000000abc

      timestamp_format:
        description: AI event timestamps preserve their instant and use canonical UTC wire format
        tests:
          - name: non_utc_event_timestamp_is_converted_to_utc
            description: A timestamp override with a non-UTC offset preserves its instant and is sent in UTC
            sdk_types: [server]
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
                  timestamp: "2025-01-02T08:34:05+05:30"
              - action: flush
              - action: assert_event_field_is_rfc3339
                params:
                  field: timestamp
                  expected: "2025-01-02T03:04:05Z"

      partial_batch_handling:
        description: capture_ai honors per-event V1 results
        tests:
          - name: does_not_retry_dropped_events
            description: An AI event with result "drop" is not retried
            sdk_types: [server]
            steps:
              - action: configure_mock_responses
                params:
                  responses:
                    - v1_event_results: ["drop"]
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
              - action: flush
              - action: wait
                params:
                  duration_ms: 3000
              - action: assert_request_count
                params:
                  expected: 1

          - name: retries_only_retry_events
            description: After a partial 200, only the AI event with result "retry" is re-sent
            sdk_types: [server]
            steps:
              - action: configure_mock_responses
                params:
                  responses:
                    - v1_event_results: ["ok", "retry"]
                    - status_code: 200
              - action: init
                params:
                  flush_at: 10
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_span
              - action: flush
              - action: wait
                params:
                  duration_ms: 5000
              - action: assert_request_count_gte
                params:
                  expected: 2
              - action: assert_partial_batch_retry_pruning
              - action: assert_request_path
                params:
                  expected: /i/v1/ai/events

      event_options:
        description: capture_ai carries event options in the per-event options object
        tests:
          - name: known_options_are_sent
            description: The four known options reach the event options object
            sdk_types: [server]
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
                  options:
                    cookieless_mode: true
                    disable_skew_correction: true
                    process_person_profile: false
                    product_tour_id: "tour_123"
              - action: flush
              - action: assert_event_option
                params:
                  option: cookieless_mode
                  expected: true
              - action: assert_event_option
                params:
                  option: disable_skew_correction
                  expected: true
              - action: assert_event_option
                params:
                  option: process_person_profile
                  expected: false
              - action: assert_event_option
                params:
                  option: product_tour_id
                  expected: "tour_123"

          - name: unset_options_omitted
            description: Options left unset are omitted (server defaults apply)
            sdk_types: [server]
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
              - action: flush
              - action: assert_event_option
                params:
                  option: process_person_profile
                  absent: true
              - action: assert_event_option
                params:
                  option: cookieless_mode
                  absent: true

          - name: unknown_option_passes_through
            description: An option the SDK does not know is sent unchanged
            sdk_types: [server]
            requires: event_options
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
                  options:
                    future_option: {"nested": [1, "two"]}
              - action: flush
              - action: assert_event_option
                params:
                  option: future_option
                  expected: {"nested": [1, "two"]}

          - name: option_value_is_not_converted
            description: The SDK sends option values unchanged and leaves validation to PostHog
            sdk_types: [server]
            requires: event_options
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
                  options:
                    process_person_profile: "no"
              - action: flush
              - action: assert_event_option
                params:
                  option: process_person_profile
                  expected: "no"

          - name: option_wins_over_legacy_property
            description: An explicit option beats its legacy $ property, which never reaches properties
            sdk_types: [server]
            requires: event_options
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
                  properties:
                    $process_person_profile: true
                  options:
                    process_person_profile: false
              - action: flush
              - action: assert_event_option
                params:
                  option: process_person_profile
                  expected: false
              - action: assert_event_property
                params:
                  property: $process_person_profile
                  absent: true

          - name: legacy_property_fills_unset_option
            description: A legacy $ property fills its unset option and leaves properties
            sdk_types: [server]
            requires: event_options
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
                  properties:
                    $cookieless_mode: true
              - action: flush
              - action: assert_event_option
                params:
                  option: cookieless_mode
                  expected: true
              - action: assert_event_property
                params:
                  property: $cookieless_mode
                  absent: true

          - name: null_option_falls_back_to_legacy_property
            description: A null option counts as unset, so its legacy $ property applies
            sdk_types: [server]
            requires: event_options
            steps:
              - action: init
                params:
                  flush_at: 1
              - action: capture_ai
                params:
                  distinct_id: test_user
                  event: $ai_generation
                  properties:
                    $product_tour_id: "tour_legacy"
                  options:
                    product_tour_id: null
              - action: flush
              - action: assert_event_option
                params:
                  option: product_tour_id
                  expected: "tour_legacy"
              - action: assert_event_property
                params:
                  property: $product_tour_id
                  absent: true
