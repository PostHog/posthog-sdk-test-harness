  # Adapter interaction actions
  init:
    description: Initialize the SDK adapter
    params:
      api_key:
        type: string
        default: phc_test_key
      host:
        type: string
        default: http://mock-server:8081
      flush_at:
        type: integer
        optional: true
      flush_interval_ms:
        type: integer
        optional: true
      max_retries:
        type: integer
        optional: true
      enable_compression:
        type: boolean
        optional: true
      disable_geoip:
        type: boolean
        optional: true
        description: Disable GeoIP enrichment (SDK injects $geoip_disable on captured events)
      personal_api_key:
        type: string
        optional: true
        description: Privileged definitions key for feature_flags_local_evaluation_v1 opt-in
      super_properties:
        type: object
        optional: true
        description: Global (super) properties to register (property_layers)
      before_send:
        type: object
        optional: true
        description: 'Install a before_send hook; {"set_properties": {...}} sets those keys on every event (property_layers)'
      historical_migration:
        type: boolean
        optional: true
        description: Mark batches as historical migration (V1 sets historical_migration in the request body)

  capture:
    description: Capture a single event via the adapter
    params:
      distinct_id:
        type: string
        required: true
      event:
        type: string
        required: true
      properties:
        type: object
        optional: true
      timestamp:
        type: string
        optional: true
        description: UTC is preferred; convert non-UTC offsets to the equivalent UTC instant before sending
      options:
        type: object
        optional: true
        description: V1 event options map; pass it to the SDK unchanged
      uuid:
        type: string
        optional: true
        description: Caller-supplied event UUID (requires the event_uuid_override capability); pass it to the SDK as given
      pad_properties_to_bytes:
        type: integer
        optional: true
        description: Add a $test_padding string property so properties serialize (compact JSON, UTF-8) to exactly this many bytes (generated_payloads)
      marker:
        type: string
        optional: true
        description: Start the padding string with this text (generated_payloads)

  capture_ai:
    description: Call the SDK's capture_ai / captureAi method (dedicated AI capture endpoint)
    params:
      distinct_id:
        type: string
        required: true
      event:
        type: string
        required: true
      properties:
        type: object
        optional: true
      timestamp:
        type: string
        optional: true
        description: UTC is preferred; convert non-UTC offsets to the equivalent UTC instant before sending
      options:
        type: object
        optional: true
        description: V1 event options map; pass it to the SDK unchanged
      uuid:
        type: string
        optional: true
        description: Caller-supplied event UUID (requires the event_uuid_override capability); pass it to the SDK as given
      pad_properties_to_bytes:
        type: integer
        optional: true
        description: Add a $test_padding string property so properties serialize (compact JSON, UTF-8) to exactly this many bytes (generated_payloads)
      marker:
        type: string
        optional: true
        description: Start the padding string with this text (generated_payloads)

  capture_multiple:
    description: Capture multiple events
    params:
      count:
        type: integer
        required: true
        description: Number of events to capture
      params:
        type: object
        required: true
        description: Template for event parameters (can use {index} placeholder)

  capture_ai_multiple:
    description: Capture multiple events with capture_ai (dedicated AI capture endpoint)
    params:
      count:
        type: integer
        required: true
        description: Number of events to capture
      params:
        type: object
        required: true
        description: Template for capture_ai parameters (can use {index} placeholder)

  get_feature_flag:
    description: Evaluate a feature flag via the adapter
    params:
      key:
        type: string
        required: true
        description: Feature flag key to evaluate
      distinct_id:
        type: string
        required: true
        description: Unique identifier for the user.
      person_properties:
        type: object
        optional: true
        description: Person properties to send with the request
      groups:
        type: object
        optional: true
        description: Group identifiers
      group_properties:
        type: object
        optional: true
        description: Group properties
      disable_geoip:
        type: boolean
        optional: true
        description: Disable GeoIP lookup for this request
      force_remote:
        type: boolean
        optional: true
        description: Force a remote /flags request even if the SDK can evaluate flags locally

      only_evaluate_locally:
        type: boolean
        optional: true
        description: No remote fallback; require locally_evaluated=true. Conflicts with force_remote=true.
      person_property_keys_known_absent:
        type: array
        items:
          type: string
        optional: true
        description: Person property keys known absent for this evaluation; requires feature_flags_known_absent_v1. Pass unchanged to the SDK.
      group_property_keys_known_absent:
        type: object
        optional: true
        description: Group type name to array of group property keys known absent; requires feature_flags_known_absent_v1. Pass unchanged to the SDK.
      allow_remote_fallback:
        type: boolean
        optional: true
        description: Use the SDK's default getter on the client with local definitions (local, then /flags when inconclusive); requires feature_flags_known_absent_v1 or feature_flags_unsupported_filter_types_v1. Conflicts with force_remote=true and only_evaluate_locally=true (400).
      expect_inconclusive:
        type: boolean
        optional: true
        description: Harness-only, never sent to the adapter. With only_evaluate_locally=true, require no flag value (null or missing) instead of a conclusive local result; still requires zero /flags requests.
      expected_unresolved_reason:
        type: string
        optional: true
        description: Harness-only, never sent to the adapter. With expect_inconclusive=true, require the adapter's unresolved_reason to equal this value; used only by tests that require feature_flags_unresolved_reasons_v1.

  get_feature_flag_for_case:
    description: Call /get_feature_flag with force_remote=true for a fixture case's requested key
    params:
      source:
        type: string
        default: readers
        description: Fixture source of case (readers or values)
      case:
        type: string
        required: true
        description: Fixture case ID; supplies the key
      distinct_id:
        type: string
        default: flags-v4-person

  get_feature_flag_payload:
    description: Call /get_feature_flag_payload with force_remote=true for a fixture case's requested key; requires feature_flag_payloads
    params:
      source:
        type: string
        default: readers
        description: Fixture source of case (readers or values)
      case:
        type: string
        required: true
        description: Fixture case ID; supplies the key
      distinct_id:
        type: string
        default: flags-v4-person

  reload_feature_flag_definitions:
    description: Opt-in fresh definitions GET and bounded readiness barrier; requires feature_flags_local_evaluation_v1
    params:
      timeout_ms:
        type: integer
        default: 5000
        description: Positive deadline, at most 30000 ms; errors or ready=false fail the test

  flush:
    description: Flush pending events via the adapter
    params: {}

  reset:
    description: Reset adapter state
    params: {}
