  # Adapter interaction actions
  init:
    description: Initialize the SDK adapter
    params:
      api_key:
        type: string
        default: phc_test_key
      host:
        type: string
        default: http://mock-server:8081
      flush_at:
        type: integer
        optional: true
      flush_interval_ms:
        type: integer
        optional: true
      max_retries:
        type: integer
        optional: true
      enable_compression:
        type: boolean
        optional: true
      disable_geoip:
        type: boolean
        optional: true
        description: Disable GeoIP enrichment (SDK injects $geoip_disable on captured events)
      personal_api_key:
        type: string
        optional: true
        description: Privileged definitions key for feature_flags_local_evaluation_v1 opt-in
      historical_migration:
        type: boolean
        optional: true
        description: Mark batches as historical migration (V1 sets historical_migration in the request body)

  capture:
    description: Capture a single event via the adapter
    params:
      distinct_id:
        type: string
        required: true
      event:
        type: string
        required: true
      properties:
        type: object
        optional: true
      timestamp:
        type: string
        optional: true
        description: UTC is preferred; convert non-UTC offsets to the equivalent UTC instant before sending
      options:
        type: object
        optional: true
        description: V1 EventOptions overrides (cookieless_mode, disable_skew_correction, process_person_profile, product_tour_id)

  capture_ai:
    description: Call the SDK's capture_ai / captureAi method (dedicated AI capture endpoint)
    params:
      distinct_id:
        type: string
        required: true
      event:
        type: string
        required: true
      properties:
        type: object
        optional: true
      timestamp:
        type: string
        optional: true
        description: UTC is preferred; convert non-UTC offsets to the equivalent UTC instant before sending
      options:
        type: object
        optional: true
        description: V1 EventOptions overrides (cookieless_mode, disable_skew_correction, process_person_profile, product_tour_id)
      uuid:
        type: string
        optional: true
        description: Caller-supplied event UUID; when provided, it must be preserved on the wire

  capture_multiple:
    description: Capture multiple events
    params:
      count:
        type: integer
        required: true
        description: Number of events to capture
      params:
        type: object
        required: true
        description: Template for event parameters (can use {index} placeholder)

  get_feature_flag:
    description: Evaluate a feature flag via the adapter
    params:
      key:
        type: string
        required: true
        description: Feature flag key to evaluate
      distinct_id:
        type: string
        required: true
        description: Unique identifier for the user.
      person_properties:
        type: object
        optional: true
        description: Person properties to send with the request
      groups:
        type: object
        optional: true
        description: Group identifiers
      group_properties:
        type: object
        optional: true
        description: Group properties
      disable_geoip:
        type: boolean
        optional: true
        description: Disable GeoIP lookup for this request
      force_remote:
        type: boolean
        optional: true
        description: Force a remote /flags request even if the SDK can evaluate flags locally

      only_evaluate_locally:
        type: boolean
        optional: true
        description: No remote fallback; require locally_evaluated=true. Conflicts with force_remote=true.

  reload_feature_flag_definitions:
    description: Opt-in fresh definitions GET and bounded readiness barrier; requires feature_flags_local_evaluation_v1
    params:
      timeout_ms:
        type: integer
        default: 5000
        description: Positive deadline, at most 30000 ms; errors or ready=false fail the test

  flush:
    description: Flush pending events via the adapter
    params: {}

  reset:
    description: Reset adapter state
    params: {}
